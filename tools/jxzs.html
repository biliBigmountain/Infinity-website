<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂辅助小工具 - 教学助手</title>
	<link rel="shortcut icon" type="image/x-icon" href="https://img.cdn1.vip/i/68c41cce83a0f_1757682894.jpeg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        
        .tool-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .tool-card h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
        }
        
        .tool-card h2 i {
            margin-right: 10px;
            font-size: 1.5rem;
        }
        
        .timer-display {
            font-size: 3rem;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button.reset {
            background-color: #e74c3c;
        }
        
        button.reset:hover {
            background-color: #c0392b;
        }
        
        button.success {
            background-color: #2ecc71;
        }
        
        button.success:hover {
            background-color: #27ae60;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        textarea {
            height: 150px;
            resize: vertical;
        }
        
        .student-list {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #f9f9f9;
        }
        
        .student-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            background-color: white;
            border-radius: 4px;
            border-left: 4px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .selected-student {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .notes-list {
            margin-top: 20px;
        }
        
        .note-item {
            background-color: #fff9e6;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #f39c12;
        }
        
        .note-time {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        
        .key-points {
            list-style-type: none;
        }
        
        .key-points li {
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #e8f4fc;
            border-radius: 6px;
            border-left: 4px solid #3498db;
            cursor: pointer;
        }
        
        .highlight {
            background-color: #fffacd;
            padding: 3px 5px;
            border-radius: 3px;
        }
        
        .group-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .group {
            background-color: #e8f4fc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3498db;
        }
        
        .group h3 {
            margin-bottom: 10px;
            text-align: center;
            color: #2c3e50;
        }
        
        .group-member {
            padding: 5px;
            margin-bottom: 5px;
            background-color: white;
            border-radius: 4px;
        }
        
        .feedback-item {
            background-color: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #9b59b6;
        }
        
        .feedback-rating {
            display: flex;
            margin: 10px 0;
        }
        
        .star {
            color: #f1c40f;
            font-size: 1.5rem;
            margin-right: 5px;
        }
        
        .media-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .media-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }
        
        .quiz-container {
            text-align: center;
        }
        
        .quiz-question {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .quiz-option {
            padding: 15px;
            background-color: #e8f4fc;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .quiz-option:hover {
            background-color: #d4e6f1;
        }
        
        .quiz-result {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }
        
        .correct {
            background-color: #d5f5e3;
            color: #27ae60;
        }
        
        .incorrect {
            background-color: #fadbd8;
            color: #e74c3c;
        }
        
        .lottery-result {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 12px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .timer-display {
                font-size: 2.5rem;
            }
            
            .quiz-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="common-theme.css">
</head>
<body>
    <div class="site-common-controls"><a class="site-home-btn" href="/index" aria-label="返回主页"><i class="ri-home-4-line"></i><span>返回主页</span></a><button class="site-theme-btn" type="button" data-site-theme-toggle aria-label="切换深浅色模式"><i class="ri-sun-line"></i></button></div>
    <div class="container">
        <header>
            <h1>课堂辅助小工具</h1>
            <p class="subtitle">专为教师设计的教学助手 - 提高课堂效率，优化教学体验</p>
        </header>
        
        <div class="tools-grid">
            <!-- 计时器工具 -->
            <div class="tool-card">
                <h2><i class="fas fa-clock"></i> 课堂计时器</h2>
                <div class="timer-display" id="timerDisplay">00:00:00</div>
                <div class="timer-controls">
                    <button id="startTimer">开始</button>
                    <button id="pauseTimer">暂停</button>
                    <button id="resetTimer" class="reset">重置</button>
                </div>
                <div style="margin-top: 20px;">
                    <label for="timerDuration">设置倒计时（分钟）：</label>
                    <input type="number" id="timerDuration" min="1" max="120" value="10">
                    <button id="setCountdown">设置倒计时</button>
                </div>
            </div>
            
            <!-- 随机点名工具 -->
            <div class="tool-card">
                <h2><i class="fas fa-users"></i> 随机点名</h2>
                <div class="student-list" id="studentList">
                    <!-- 学生列表将通过JavaScript动态生成 -->
                </div>
                <div>
                    <input type="text" id="newStudent" placeholder="输入学生姓名">
                    <button id="addStudent">添加学生</button>
                    <button id="clearStudents">清空列表</button>
                </div>
                <div class="selected-student" id="selectedStudent">
                    点击下方按钮开始点名
                </div>
                <div style="text-align: center;">
                    <button id="pickStudent" style="padding: 12px 30px; font-size: 1.1rem;">随机点名</button>
                </div>
            </div>
            
            <!-- 课堂笔记工具 -->
            <div class="tool-card">
                <h2><i class="fas fa-sticky-note"></i> 课堂笔记</h2>
                <textarea id="noteInput" placeholder="记录课堂要点、学生表现或教学反思..."></textarea>
                <button id="saveNote">保存笔记</button>
                <div class="notes-list" id="notesList">
                    <!-- 笔记将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <!-- 重点提示工具 -->
            <div class="tool-card">
                <h2><i class="fas fa-bullseye"></i> 本课重点</h2>
                <div>
                    <input type="text" id="newKeyPoint" placeholder="输入本课重点内容">
                    <button id="addKeyPoint">添加重点</button>
                </div>
                <ul class="key-points" id="keyPointsList">
                    <!-- 重点内容将通过JavaScript动态生成 -->
                </ul>
                <div style="margin-top: 20px; font-size: 0.9rem; color: #7f8c8d;">
                    <p>提示：点击重点内容可标记为<span class="highlight">已完成</span></p>
                </div>
            </div>
            
            <!-- 抽签工具 -->
            <div class="tool-card">
                <h2><i class="fas fa-dice"></i> 抽签工具</h2>
                <div>
                    <textarea id="lotteryItems" placeholder="输入抽签选项，每行一个"></textarea>
                    <button id="startLottery">开始抽签</button>
                </div>
                <div class="lottery-result" id="lotteryResult">
                    抽签结果将显示在这里
                </div>
                <div style="text-align: center;">
                    <button id="resetLottery" class="reset">重置抽签</button>
                </div>
            </div>
            
            <!-- 分组生成器 -->
            <div class="tool-card">
                <h2><i class="fas fa-object-group"></i> 分组生成器</h2>
                <div>
                    <textarea id="groupStudents" placeholder="输入学生名单，每行一个"></textarea>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="groupCount" placeholder="组数" min="2" max="10">
                        <input type="number" id="groupSize" placeholder="每组人数" min="2" max="10">
                    </div>
                    <button id="generateGroups">生成分组</button>
                </div>
                <div class="group-container" id="groupContainer">
                    <!-- 分组结果将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <!-- 课堂反馈 -->
            <div class="tool-card">
                <h2><i class="fas fa-comment-alt"></i> 课堂反馈</h2>
                <div>
                    <textarea id="feedbackInput" placeholder="请留下您对这节课的反馈..."></textarea>
                    <div>
                        <label for="feedbackRating">评分：</label>
                        <select id="feedbackRating">
                            <option value="5">★★★★★ 非常好</option>
                            <option value="4">★★★★ 很好</option>
                            <option value="3">★★★ 一般</option>
                            <option value="2">★★ 较差</option>
                            <option value="1">★ 非常差</option>
                        </select>
                    </div>
                    <button id="submitFeedback">提交反馈</button>
                </div>
                <div class="notes-list" id="feedbackList">
                    <!-- 反馈将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <!-- 多媒体控制 -->
            <div class="tool-card">
                <h2><i class="fas fa-film"></i> 多媒体控制</h2>
                <div style="text-align: center;">
                    <div class="timer-display" id="mediaTimer">00:00 / 00:00</div>
                    <div class="media-controls">
                        <div class="media-btn" id="rewindBtn">
                            <i class="fas fa-backward"></i>
                        </div>
                        <div class="media-btn" id="playPauseBtn">
                            <i class="fas fa-play"></i>
                        </div>
                        <div class="media-btn" id="forwardBtn">
                            <i class="fas fa-forward"></i>
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <input type="range" id="volumeSlider" min="0" max="100" value="80">
                        <div>音量控制</div>
                    </div>
                </div>
            </div>
            
            <!-- 课堂小游戏 -->
            <div class="tool-card">
                <h2><i class="fas fa-gamepad"></i> 课堂小游戏</h2>
                <div class="quiz-container">
                    <div class="quiz-question" id="quizQuestion">问题将显示在这里</div>
                    <div class="quiz-options" id="quizOptions">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </div>
                    <button id="nextQuestion">下一题</button>
                    <div class="quiz-result" id="quizResult">
                        <!-- 答题结果将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>课堂辅助小工具 &copy; 2023 | 专为教师设计的教学助手</p>
        </footer>
    </div>

    <script>
        // 计时器功能
        let timerInterval;
        let timerSeconds = 0;
        let isTimerRunning = false;
        let isCountdown = false;
        let countdownSeconds = 0;
        
        const timerDisplay = document.getElementById('timerDisplay');
        const startTimerBtn = document.getElementById('startTimer');
        const pauseTimerBtn = document.getElementById('pauseTimer');
        const resetTimerBtn = document.getElementById('resetTimer');
        const setCountdownBtn = document.getElementById('setCountdown');
        const timerDuration = document.getElementById('timerDuration');
        
        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateTimerDisplay() {
            if (isCountdown) {
                timerDisplay.textContent = formatTime(countdownSeconds);
                if (countdownSeconds <= 0) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    timerDisplay.style.color = '#e74c3c';
                    alert('倒计时结束！');
                }
            } else {
                timerDisplay.textContent = formatTime(timerSeconds);
            }
        }
        
        function startTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    if (isCountdown) {
                        if (countdownSeconds > 0) {
                            countdownSeconds--;
                            updateTimerDisplay();
                        } else {
                            clearInterval(timerInterval);
                            isTimerRunning = false;
                        }
                    } else {
                        timerSeconds++;
                        updateTimerDisplay();
                    }
                }, 1000);
            }
        }
        
        function pauseTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
        }
        
        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            isCountdown = false;
            timerSeconds = 0;
            countdownSeconds = 0;
            timerDisplay.style.color = '#2c3e50';
            updateTimerDisplay();
        }
        
        function setCountdown() {
            const minutes = parseInt(timerDuration.value) || 10;
            countdownSeconds = minutes * 60;
            isCountdown = true;
            timerDisplay.style.color = '#2c3e50';
            updateTimerDisplay();
        }
        
        startTimerBtn.addEventListener('click', startTimer);
        pauseTimerBtn.addEventListener('click', pauseTimer);
        resetTimerBtn.addEventListener('click', resetTimer);
        setCountdownBtn.addEventListener('click', setCountdown);
        
        // 随机点名功能
        let students = ['张三', '李四', '王五', '赵六', '钱七', '孙八', '周九', '吴十'];
        const studentList = document.getElementById('studentList');
        const newStudentInput = document.getElementById('newStudent');
        const addStudentBtn = document.getElementById('addStudent');
        const clearStudentsBtn = document.getElementById('clearStudents');
        const pickStudentBtn = document.getElementById('pickStudent');
        const selectedStudent = document.getElementById('selectedStudent');
        
        function renderStudentList() {
            studentList.innerHTML = '';
            students.forEach((student, index) => {
                const studentItem = document.createElement('div');
                studentItem.className = 'student-item';
                studentItem.innerHTML = `
                    <span>${student}</span>
                    <button onclick="removeStudent(${index})" style="padding: 3px 8px; font-size: 0.8rem;">删除</button>
                `;
                studentList.appendChild(studentItem);
            });
        }
        
        function addStudent() {
            const name = newStudentInput.value.trim();
            if (name && !students.includes(name)) {
                students.push(name);
                renderStudentList();
                newStudentInput.value = '';
            }
        }
        
        function removeStudent(index) {
            students.splice(index, 1);
            renderStudentList();
        }
        
        function clearStudents() {
            if (confirm('确定要清空所有学生吗？')) {
                students = [];
                renderStudentList();
            }
        }
        
        function pickRandomStudent() {
            if (students.length === 0) {
                selectedStudent.textContent = '请先添加学生';
                return;
            }
            
            // 随机选择动画效果
            let iterations = 0;
            const maxIterations = 20;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * students.length);
                selectedStudent.textContent = students[randomIndex];
                iterations++;
                
                if (iterations >= maxIterations) {
                    clearInterval(interval);
                    // 最终选择
                    const finalIndex = Math.floor(Math.random() * students.length);
                    selectedStudent.textContent = students[finalIndex];
                    selectedStudent.style.backgroundColor = '#e1f5fe';
                }
            }, 100);
        }
        
        addStudentBtn.addEventListener('click', addStudent);
        clearStudentsBtn.addEventListener('click', clearStudents);
        pickStudentBtn.addEventListener('click', pickRandomStudent);
        
        // 初始化学生列表
        renderStudentList();
        
        // 课堂笔记功能
        let notes = [];
        const noteInput = document.getElementById('noteInput');
        const saveNoteBtn = document.getElementById('saveNote');
        const notesList = document.getElementById('notesList');
        
        function renderNotes() {
            notesList.innerHTML = '';
            if (notes.length === 0) {
                notesList.innerHTML = '<p style="text-align: center; color: #7f8c8d;">暂无笔记，开始记录吧</p>';
                return;
            }
            
            notes.forEach((note, index) => {
                const noteItem = document.createElement('div');
                noteItem.className = 'note-item';
                noteItem.innerHTML = `
                    <div class="note-time">${note.time}</div>
                    <div>${note.content}</div>
                    <button onclick="deleteNote(${index})" style="margin-top: 10px; padding: 5px 10px; font-size: 0.8rem; background-color: #e74c3c;">删除</button>
                `;
                notesList.appendChild(noteItem);
            });
        }
        
        function saveNote() {
            const content = noteInput.value.trim();
            if (content) {
                const now = new Date();
                const timeString = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                notes.unshift({
                    time: timeString,
                    content: content
                });
                
                noteInput.value = '';
                renderNotes();
            }
        }
        
        function deleteNote(index) {
            if (confirm('确定要删除这条笔记吗？')) {
                notes.splice(index, 1);
                renderNotes();
            }
        }
        
        saveNoteBtn.addEventListener('click', saveNote);
        
        // 初始化笔记列表
        renderNotes();
        
        // 重点提示功能
        let keyPoints = ['掌握本节课核心概念', '完成课后练习题', '预习下一章节内容'];
        const newKeyPointInput = document.getElementById('newKeyPoint');
        const addKeyPointBtn = document.getElementById('addKeyPoint');
        const keyPointsList = document.getElementById('keyPointsList');
        
        function renderKeyPoints() {
            keyPointsList.innerHTML = '';
            keyPoints.forEach((point, index) => {
                const li = document.createElement('li');
                li.textContent = point;
                li.addEventListener('click', () => {
                    li.style.textDecoration = li.style.textDecoration === 'line-through' ? 'none' : 'line-through';
                    li.style.backgroundColor = li.style.textDecoration === 'line-through' ? '#f0f0f0' : '#e8f4fc';
                });
                keyPointsList.appendChild(li);
            });
        }
        
        function addKeyPoint() {
            const point = newKeyPointInput.value.trim();
            if (point) {
                keyPoints.push(point);
                renderKeyPoints();
                newKeyPointInput.value = '';
            }
        }
        
        addKeyPointBtn.addEventListener('click', addKeyPoint);
        
        // 初始化重点列表
        renderKeyPoints();
        
        // 抽签工具功能
        const lotteryItems = document.getElementById('lotteryItems');
        const startLotteryBtn = document.getElementById('startLottery');
        const resetLotteryBtn = document.getElementById('resetLottery');
        const lotteryResult = document.getElementById('lotteryResult');
        
        function startLottery() {
            const itemsText = lotteryItems.value.trim();
            if (!itemsText) {
                lotteryResult.textContent = '请输入抽签选项';
                return;
            }
            
            const items = itemsText.split('\n').filter(item => item.trim() !== '');
            if (items.length === 0) {
                lotteryResult.textContent = '请输入有效的抽签选项';
                return;
            }
            
            // 抽签动画效果
            let iterations = 0;
            const maxIterations = 15;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * items.length);
                lotteryResult.textContent = items[randomIndex];
                iterations++;
                
                if (iterations >= maxIterations) {
                    clearInterval(interval);
                    // 最终结果
                    const finalIndex = Math.floor(Math.random() * items.length);
                    lotteryResult.textContent = items[finalIndex];
                }
            }, 100);
        }
        
        function resetLottery() {
            lotteryResult.textContent = '抽签结果将显示在这里';
            lotteryItems.value = '';
        }
        
        startLotteryBtn.addEventListener('click', startLottery);
        resetLotteryBtn.addEventListener('click', resetLottery);
        
        // 分组生成器功能
        const groupStudents = document.getElementById('groupStudents');
        const groupCount = document.getElementById('groupCount');
        const groupSize = document.getElementById('groupSize');
        const generateGroupsBtn = document.getElementById('generateGroups');
        const groupContainer = document.getElementById('groupContainer');
        
        function generateGroups() {
            const studentsText = groupStudents.value.trim();
            if (!studentsText) {
                groupContainer.innerHTML = '<p>请输入学生名单</p>';
                return;
            }
            
            const studentList = studentsText.split('\n').filter(student => student.trim() !== '');
            if (studentList.length === 0) {
                groupContainer.innerHTML = '<p>请输入有效的学生名单</p>';
                return;
            }
            
            const numGroups = parseInt(groupCount.value) || 0;
            const groupMemberCount = parseInt(groupSize.value) || 0;
            
            if (numGroups === 0 && groupMemberCount === 0) {
                groupContainer.innerHTML = '<p>请指定组数或每组人数</p>';
                return;
            }
            
            // 随机打乱学生列表
            const shuffledStudents = [...studentList].sort(() => Math.random() - 0.5);
            
            let groups = [];
            
            if (numGroups > 0) {
                // 按组数分组
                for (let i = 0; i < numGroups; i++) {
                    groups.push([]);
                }
                
                shuffledStudents.forEach((student, index) => {
                    groups[index % numGroups].push(student);
                });
            } else {
                // 按每组人数分组
                for (let i = 0; i < shuffledStudents.length; i += groupMemberCount) {
                    groups.push(shuffledStudents.slice(i, i + groupMemberCount));
                }
            }
            
            // 渲染分组结果
            groupContainer.innerHTML = '';
            groups.forEach((group, index) => {
                const groupElement = document.createElement('div');
                groupElement.className = 'group';
                groupElement.innerHTML = `<h3>第${index + 1}组</h3>`;
                
                group.forEach(student => {
                    const memberElement = document.createElement('div');
                    memberElement.className = 'group-member';
                    memberElement.textContent = student;
                    groupElement.appendChild(memberElement);
                });
                
                groupContainer.appendChild(groupElement);
            });
        }
        
        generateGroupsBtn.addEventListener('click', generateGroups);
        
        // 课堂反馈功能
        let feedbacks = [];
        const feedbackInput = document.getElementById('feedbackInput');
        const feedbackRating = document.getElementById('feedbackRating');
        const submitFeedbackBtn = document.getElementById('submitFeedback');
        const feedbackList = document.getElementById('feedbackList');
        
        function renderFeedbacks() {
            feedbackList.innerHTML = '';
            if (feedbacks.length === 0) {
                feedbackList.innerHTML = '<p style="text-align: center; color: #7f8c8d;">暂无反馈</p>';
                return;
            }
            
            feedbacks.forEach((feedback, index) => {
                const feedbackItem = document.createElement('div');
                feedbackItem.className = 'feedback-item';
                
                let stars = '';
                for (let i = 0; i < 5; i++) {
                    if (i < feedback.rating) {
                        stars += '<span class="star">★</span>';
                    } else {
                        stars += '<span class="star" style="color: #ddd">★</span>';
                    }
                }
                
                feedbackItem.innerHTML = `
                    <div class="feedback-rating">${stars}</div>
                    <div>${feedback.content}</div>
                    <div class="note-time">${feedback.time}</div>
                    <button onclick="deleteFeedback(${index})" style="margin-top: 10px; padding: 5px 10px; font-size: 0.8rem; background-color: #e74c3c;">删除</button>
                `;
                feedbackList.appendChild(feedbackItem);
            });
        }
        
        function submitFeedback() {
            const content = feedbackInput.value.trim();
            const rating = parseInt(feedbackRating.value);
            
            if (content) {
                const now = new Date();
                const timeString = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                feedbacks.unshift({
                    time: timeString,
                    content: content,
                    rating: rating
                });
                
                feedbackInput.value = '';
                renderFeedbacks();
                
                alert('感谢您的反馈！');
            }
        }
        
        function deleteFeedback(index) {
            if (confirm('确定要删除这条反馈吗？')) {
                feedbacks.splice(index, 1);
                renderFeedbacks();
            }
        }
        
        submitFeedbackBtn.addEventListener('click', submitFeedback);
        
        // 初始化反馈列表
        renderFeedbacks();
        
        // 多媒体控制功能
        const mediaTimer = document.getElementById('mediaTimer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        
        let isPlaying = false;
        let currentTime = 0;
        const totalTime = 300; // 5分钟
        
        function updateMediaTimer() {
            const currentMinutes = Math.floor(currentTime / 60);
            const currentSeconds = Math.floor(currentTime % 60);
            const totalMinutes = Math.floor(totalTime / 60);
            const totalSeconds = Math.floor(totalTime % 60);
            
            mediaTimer.textContent = `${currentMinutes.toString().padStart(2, '0')}:${currentSeconds.toString().padStart(2, '0')} / ${totalMinutes.toString().padStart(2, '0')}:${totalSeconds.toString().padStart(2, '0')}`;
        }
        
        function togglePlayPause() {
            isPlaying = !isPlaying;
            const icon = playPauseBtn.querySelector('i');
            icon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
            
            if (isPlaying) {
                // 模拟播放
                const interval = setInterval(() => {
                    if (isPlaying && currentTime < totalTime) {
                        currentTime++;
                        updateMediaTimer();
                    } else {
                        clearInterval(interval);
                        isPlaying = false;
                        icon.className = 'fas fa-play';
                    }
                }, 1000);
            }
        }
        
        function rewind() {
            currentTime = Math.max(0, currentTime - 10);
            updateMediaTimer();
        }
        
        function forward() {
            currentTime = Math.min(totalTime, currentTime + 10);
            updateMediaTimer();
        }
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        rewindBtn.addEventListener('click', rewind);
        forwardBtn.addEventListener('click', forward);
        
        // 初始化媒体计时器
        updateMediaTimer();
        
        // 课堂小游戏功能
        const quizQuestions = [
            {
                question: "中国的首都是哪个城市？",
                options: ["上海", "北京", "广州", "深圳"],
                correct: 1
            },
            {
                question: "以下哪个不是哺乳动物？",
                options: ["鲸鱼", "蝙蝠", "企鹅", "海豚"],
                correct: 2
            },
            {
                question: "《红楼梦》的作者是谁？",
                options: ["施耐庵", "吴承恩", "曹雪芹", "罗贯中"],
                correct: 2
            }
        ];
        
        let currentQuestionIndex = 0;
        const quizQuestion = document.getElementById('quizQuestion');
        const quizOptions = document.getElementById('quizOptions');
        const nextQuestionBtn = document.getElementById('nextQuestion');
        const quizResult = document.getElementById('quizResult');
        
        function loadQuestion() {
            const question = quizQuestions[currentQuestionIndex];
            quizQuestion.textContent = question.question;
            quizOptions.innerHTML = '';
            quizResult.textContent = '';
            quizResult.className = 'quiz-result';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'quiz-option';
                optionElement.textContent = option;
                optionElement.addEventListener('click', () => checkAnswer(index));
                quizOptions.appendChild(optionElement);
            });
            
            nextQuestionBtn.disabled = true;
        }
        
        function checkAnswer(selectedIndex) {
            const question = quizQuestions[currentQuestionIndex];
            const options = quizOptions.querySelectorAll('.quiz-option');
            
            options.forEach((option, index) => {
                if (index === question.correct) {
                    option.style.backgroundColor = '#d5f5e3';
                } else if (index === selectedIndex) {
                    option.style.backgroundColor = '#fadbd8';
                }
                option.style.pointerEvents = 'none';
            });
            
            if (selectedIndex === question.correct) {
                quizResult.textContent = '回答正确！';
                quizResult.className = 'quiz-result correct';
            } else {
                quizResult.textContent = '回答错误！';
                quizResult.className = 'quiz-result incorrect';
            }
            
            nextQuestionBtn.disabled = false;
        }
        
        function nextQuestion() {
            currentQuestionIndex = (currentQuestionIndex + 1) % quizQuestions.length;
            loadQuestion();
        }
        
        nextQuestionBtn.addEventListener('click', nextQuestion);
        
        // 初始化第一个问题
        loadQuestion();
    </script>

    <script>
        (() => {
            const root = document.documentElement;
            const button = document.querySelector('[data-site-theme-toggle]');
            const saved = localStorage.getItem('site-theme-preference') || 'system';
            const apply = mode => {
                const light = mode === 'light' || (mode === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches);
                root.dataset.theme = light ? 'light' : 'dark';
                document.body.classList.toggle('site-light', light);
                if (button) button.innerHTML = light ? '<i class="ri-moon-line"></i>' : '<i class="ri-sun-line"></i>';
            };
            apply(saved);
            button?.addEventListener('click', () => {
                const next = root.dataset.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('site-theme-preference', next);
                apply(next);
            });
            matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if ((localStorage.getItem('site-theme-preference') || 'system') === 'system') apply('system');
            });
        })();
    </script>
</body>
