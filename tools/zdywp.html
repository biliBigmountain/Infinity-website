<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>准大一开学需带物品清单</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://img.bloret.net/img/1778369377581/e16d22cdc027bcf461f5c27c07bc0109">
    <link rel="apple-touch-icon" href="https://img.bloret.net/img/1778369377581/e16d22cdc027bcf461f5c27c07bc0109">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css">

    <style>
        /* ===== CSS变量定义 ===== */
        :root {
            /* 浅色模式变量 */
            --light-bg-primary: #f8fafc;
            --light-bg-secondary: rgba(248, 250, 252, 0.9);
            --light-bg-card: rgba(255, 255, 255, 0.9);
            --light-text-primary: #0f172a;
            --light-text-secondary: #475569;
            --light-border-color: rgba(0, 0, 0, 0.1);
            --light-shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --light-shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --light-shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.1);
            --light-shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.15);

            /* 主色调 */
            --primary-50: #e6f7f5;
            --primary-100: #b3e8e2;
            --primary-200: #80d9cf;
            --primary-300: #4dc9bc;
            --primary-400: #26b9ab;
            --primary-500: #00a89a;
            --primary-600: #00968a;
            --primary-700: #008379;
            --primary-800: #007168;
            --primary-900: #005951;

            /* 强调色 */
            --accent-50: #e8f7fd;
            --accent-100: #c6e9fa;
            --accent-200: #a1dbf7;
            --accent-300: #7bcdf3;
            --accent-400: #5fc2f1;
            --accent-500: #44b7ee;
            --accent-600: #3ea8dc;
            --accent-700: #3695c5;
            --accent-800: #2f82ae;
            --accent-900: #226088;

            /* 中性色 */
            --neutral-50: #f8fafc;
            --neutral-100: #f1f5f9;
            --neutral-200: #e2e8f0;
            --neutral-300: #cbd5e1;
            --neutral-400: #94a3b8;
            --neutral-500: #64748b;
            --neutral-600: #475569;
            --neutral-700: #334155;
            --neutral-800: #1e293b;
            --neutral-900: #0f172a;

            /* 功能色 */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;

            /* 主题变量 - 默认深色 */
            --bg-primary: var(--neutral-900);
            --bg-secondary: rgba(15, 23, 42, 0.9);
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-card-hover: rgba(51, 65, 85, 0.9);
            --text-primary: var(--neutral-100);
            --text-secondary: var(--neutral-300);
            --text-accent: var(--accent-400);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.4);

            /* 其他变量 */
            --border-radius-sm: 8px;
            --border-radius-md: 16px;
            --border-radius-lg: 24px;
            --border-radius-xl: 32px;
            --border-radius-full: 9999px;
            --transition-fast: 0.15s ease;
            --transition-base: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --transition-slow: 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            --gradient-primary: linear-gradient(135deg, var(--primary-900), var(--primary-700), var(--accent-700));
            --gradient-accent: linear-gradient(135deg, var(--accent-500), var(--accent-700));
            --gradient-card: linear-gradient(135deg, rgba(0, 89, 81, 0.8), rgba(30, 41, 59, 0.8));

            /* 字体变量 */
            --font-family: 'Noto Sans SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-3xl: 1.875rem;
            --font-size-4xl: 2.25rem;
            --font-size-5xl: 3rem;

            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            --spacing-3xl: 4rem;
        }

        /* 浅色模式 */
        [data-theme="light"] {
            --bg-primary: var(--light-bg-primary);
            --bg-secondary: var(--light-bg-secondary);
            --bg-card: var(--light-bg-card);
            --bg-card-hover: rgba(255, 255, 255, 1);
            --text-primary: var(--light-text-primary);
            --text-secondary: var(--light-text-secondary);
            --text-accent: var(--primary-700);
            --border-color: var(--light-border-color);
            --shadow-sm: var(--light-shadow-sm);
            --shadow-md: var(--light-shadow-md);
            --shadow-lg: var(--light-shadow-lg);
            --shadow-xl: var(--light-shadow-xl);
            --gradient-card: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(240, 240, 240, 0.9));
        }

        /* ===== 重置与基础样式 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding: 0 var(--spacing-md);
        }

        /* ===== 背景效果 ===== */
        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .gradient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 89, 81, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(108, 207, 247, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(15, 23, 42, 0.2) 0%, transparent 50%);
            transition: background 0.3s ease;
        }

        [data-theme="light"] .gradient-bg {
            background: radial-gradient(circle at 20% 50%, rgba(0, 168, 154, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(108, 207, 247, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(248, 250, 252, 0.1) 0%, transparent 50%);
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-500), transparent);
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(20px, 50px) rotate(90deg);
            }
            50% {
                transform: translate(40px, 0) rotate(180deg);
            }
            75% {
                transform: translate(20px, -50px) rotate(270deg);
            }
        }

        /* ===== 滚动条样式 ===== */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--neutral-800);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-700);
            border-radius: var(--border-radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-600);
        }
        [data-theme="light"] ::-webkit-scrollbar-track {
            background: var(--neutral-200);
        }
        [data-theme="light"] ::-webkit-scrollbar-thumb {
            background: var(--primary-500);
        }
        [data-theme="light"] ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-600);
        }

        /* ===== 工具类 ===== */
        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--spacing-lg) 0 var(--spacing-2xl);
        }

        .text-gradient {
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ===== 右上角工具栏 ===== */
        .toolbar {
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            z-index: 1000;
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
        }

        .gender-toolbar-btn {
            order: 2;
            gap: var(--spacing-xs);
            font-size: var(--font-size-sm);
        }
        .theme-toggle-btn { order: 3; }
        .gender-toolbar-btn i { font-size: 1.1rem; }
        .gender-toolbar-btn span { font-size: var(--font-size-sm); white-space: nowrap; }
        .gender-toolbar-btn:hover { transform: scale(1.08) translateY(-2px); }
        .search-nav button.selected { background: var(--accent-500); color: var(--neutral-900); border-color: var(--accent-500); }
        .category-actions .ignore-btn, .category-actions .add-btn { border-width: 2px; font-weight: 700; }
        .custom-item-actions { margin-left: auto; display: flex; gap: 6px; }
        .delete-item-btn, .detail-btn { border: 1px solid var(--border-color); border-radius: var(--border-radius-full); background: transparent; color: var(--text-secondary); cursor: pointer; padding: 4px 9px; font-size: var(--font-size-xs); }
        .delete-item-btn:hover { background: var(--error); border-color: var(--error); color: white; }
        .detail-btn:hover { background: var(--accent-500); border-color: var(--accent-500); color: var(--neutral-900); }
        .site-modal { display: none; position: fixed; inset: 0; z-index: 2200; align-items: center; justify-content: center; padding: var(--spacing-md); background: rgba(15, 23, 42, .68); }
        .site-modal.show { display: flex; animation: modal-fade-in .22s linear both; }
        .site-modal-card { width: min(500px, 100%); max-height: min(80vh, 620px); overflow: auto; padding: var(--spacing-xl); background: var(--bg-card); border: 2px solid var(--accent-500); border-radius: var(--border-radius-lg); box-shadow: var(--shadow-xl); animation: modal-slide-in .28s linear both; }
        .site-modal-card h2 { margin-bottom: var(--spacing-md); }
        .modal-help { color: var(--text-secondary); font-size: var(--font-size-sm); margin-bottom: var(--spacing-md); white-space: pre-line; }
        .modal-input { width: 100%; padding: var(--spacing-sm) var(--spacing-md); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); background: rgba(255,255,255,.06); color: var(--text-primary); outline: none; }
        .modal-input:focus { border-color: var(--accent-500); }
        .modal-list { display: grid; gap: 8px; margin: var(--spacing-md) 0; }
        .modal-list label { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius-md); cursor: pointer; }
        .modal-list label:has(input:checked) { border-color: var(--accent-500); background: rgba(68,183,238,.12); }
        .ignore-reason-input { display: none; flex: 1; min-width: 120px; padding: 5px 8px; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); background: rgba(255,255,255,.06); color: var(--text-primary); outline: none; }
        .modal-list label:has(input[type="checkbox"]:checked) .ignore-reason-input { display: block; }
        .ignore-reason-input:focus { border-color: var(--accent-500); }
        .modal-skip-ignored { display: flex; align-items: center; gap: var(--spacing-sm); color: var(--text-secondary); font-size: var(--font-size-sm); cursor: pointer; }
        .modal-skip-ignored input { width: 17px; height: 17px; accent-color: var(--accent-500); }
        .modal-actions { display: flex; justify-content: flex-end; gap: var(--spacing-sm); margin-top: var(--spacing-lg); }
        .modal-actions button { padding: var(--spacing-sm) var(--spacing-lg); border: 1px solid var(--border-color); border-radius: var(--border-radius-full); background: transparent; color: var(--text-secondary); cursor: pointer; }
        .modal-actions .modal-primary { background: var(--accent-500); border-color: var(--accent-500); color: var(--neutral-900); }
        @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modal-slide-in { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }

        .toolbar-btn {
            min-width: 48px;
            height: 48px;
            padding: 0 var(--spacing-md);
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-md);
            text-decoration: none;
        }

        .toolbar-btn:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-500);
            color: var(--text-accent);
        }

        .toolbar-btn .ri-home-4-line {
            font-size: 1.4rem;
        }

        .home-toolbar-btn {
            gap: var(--spacing-xs);
        }

        .home-toolbar-btn span {
            font-size: var(--font-size-sm);
            white-space: nowrap;
        }

        /* 主题切换按钮特殊样式 */
        .theme-toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        /* ===== 页面头部 ===== */
        .page-header {
            text-align: center;
            padding: var(--spacing-2xl) 0 var(--spacing-xl);
            position: relative;
        }

        .page-header h1 {
            font-size: var(--font-size-4xl);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: var(--spacing-sm);
            position: relative;
            display: inline-block;
        }

        .page-header h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--gradient-accent);
            border-radius: var(--border-radius-full);
        }

        .page-subtitle {
            font-size: var(--font-size-lg);
            color: var(--text-secondary);
            font-weight: 300;
            margin-top: var(--spacing-lg);
        }

        /* ===== 进度条区域 ===== */
        .progress-section {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-base);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .progress-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            font-size: var(--font-size-base);
            color: var(--text-secondary);
        }

        .progress-info .count {
            font-weight: 700;
            color: var(--text-accent);
            font-size: var(--font-size-lg);
        }

        .progress-percent {
            font-weight: 700;
            font-size: var(--font-size-xl);
            color: var(--text-accent);
        }

        .progress-bar-track {
            width: 100%;
            height: 10px;
            background: var(--neutral-700);
            border-radius: var(--border-radius-full);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] .progress-bar-track {
            background: var(--neutral-200);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--gradient-accent);
            border-radius: var(--border-radius-full);
            transition: width 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .progress-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
            flex-wrap: wrap;
        }

        .progress-actions .action-btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-full);
            background: transparent;
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
            font-weight: 500;
        }

        .progress-actions .action-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-500);
            color: var(--text-primary);
        }

        .progress-actions .action-btn.primary {
            background: var(--accent-500);
            color: var(--neutral-900);
            border-color: var(--accent-500);
        }

        .progress-actions .action-btn.primary:hover {
            background: var(--accent-600);
            border-color: var(--accent-600);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(68, 183, 238, 0.3);
        }

        .progress-actions .action-btn.danger {
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .data-transfer-actions { display: contents; }
        .data-transfer-actions .action-btn { padding: var(--spacing-sm) var(--spacing-lg); border: 1px solid var(--border-color); border-radius: var(--border-radius-full); background: transparent; color: var(--text-secondary); cursor: pointer; }
        .data-transfer-actions .action-btn:hover { background: var(--accent-500); border-color: var(--accent-500); color: var(--neutral-900); }
        .category-check-btn, .category-cancel-btn { padding: 5px 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius-full); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: var(--font-size-xs); white-space: nowrap; }
        .category-check-btn:hover, .category-cancel-btn:hover { background: var(--accent-500); border-color: var(--accent-500); color: var(--neutral-900); }

        .progress-actions .action-btn.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--error);
        }

        /* ===== 分类卡片网格 ===== */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-xl);
        }

        .category-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
            overflow: hidden;
            position: relative;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-primary);
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: rgba(108, 207, 247, 0.2);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
        }

        .category-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .category-title {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--text-primary);
        }

        .category-count {
            margin-left: auto;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 12px;
            border-radius: var(--border-radius-full);
            border: 1px solid var(--border-color);
        }

        .category-progress-mini {
            width: 60px;
            height: 4px;
            background: var(--neutral-700);
            border-radius: var(--border-radius-full);
            overflow: hidden;
            margin-left: var(--spacing-sm);
        }

        [data-theme="light"] .category-progress-mini {
            background: var(--neutral-200);
        }

        .category-progress-mini .mini-fill {
            height: 100%;
            background: var(--gradient-accent);
            border-radius: var(--border-radius-full);
            transition: width 0.4s ease;
        }

        /* ===== 物品列表 ===== */
        .items-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        @media (max-width: 600px) {
            .items-list {
                grid-template-columns: 1fr;
            }
        }

        .item-check {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--border-radius-md);
            transition: all var(--transition-fast);
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
            position: relative;
        }

        .item-check:hover {
            background: rgba(255, 255, 255, 0.04);

            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);

                }
            } catch (_) { /* ignore */ }
            return {};
        }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

            try { return JSON.parse(localStorage.getItem(IGNORED_KEY) || '{}') || {}; }

        function saveCustomItems(items) { localStorage.setItem(CUSTOM_ITEMS_KEY, JSON.stringify(items)); }
        function applyCustomItems() {
            const customItems = loadCustomItems();
            categoriesData.forEach(category => {
                (customItems[category.id] || []).forEach(item => {
                    if (!category.items.some(existing => existing.id === item.id)) category.items.push(item);
                });
            });

        function saveIgnored(state) { localStorage.setItem(IGNORED_KEY, JSON.stringify(state)); }
        function isIgnored(id) { return Object.prototype.hasOwnProperty.call(loadIgnored(), id); }
        function escapeHtml(value) {
            return String(value).replace(/[&<>\"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[character]));
        }

        function getVisibleItems(items) {
            return items.filter(item => !item.gender || item.gender === currentGender);
        }

        function getItemState(id) {
            const state = loadState();
            return !!state[id];
        }

        function setItemState(id, checked) {
            const state = loadState();
            if (checked) {
                state[id] = true;
            } else {
                delete state[id];
            }
            saveState(state);
        }

        function toggleItem(id) {
            const current = getItemState(id);
            setItemState(id, !current);
            return !current;
        }

        function getAllItems() {
            const items = [];
            categoriesData.forEach(cat => {
                getVisibleItems(cat.items).forEach(item => {
                    items.push({ ...item, categoryId: cat.id, categoryName: cat.name });
                });
            });
            return items;
        }

        function getCheckedCount() {
            const state = loadState();
            return getAllItems().filter(item => state[item.id] || isIgnored(item.id)).length;
        }

        function getTotalCount() {
            return getAllItems().length;
        }

        function getCategoryStats(categoryId) {
            const items = getVisibleItems(categoriesData.find(c => c.id === categoryId)?.items || []);
            const state = loadState();
            let done = 0;
            items.forEach(item => {
                if (state[item.id] || isIgnored(item.id)) done++;
            });
            return { total: items.length, done };
        }

        function getCategoryProgress(categoryId) {
            const { total, done } = getCategoryStats(categoryId);
            return total === 0 ? 0 : Math.round((done / total) * 100);

        function exportChecklist() {
            const state = loadState();
            const ignored = loadIgnored();
            const lines = ['准大一开学清单导出', `导出时间：${new Date().toLocaleString()}`, ''];
            categoriesData.forEach(category => {
                lines.push(`【${category.name}】`);
                getVisibleItems(category.items).forEach(item => {
                    const ignoredValue = Object.prototype.hasOwnProperty.call(ignored, item.id) ? ignored[item.id] : undefined;
                    const status = ignoredValue !== undefined ? '忽略' : state[item.id] ? '已带' : '未带';
                    const reason = typeof ignoredValue === 'string' && ignoredValue ? `（原因：${ignoredValue}）` : '';
                    lines.push(`${status}\t${item.name}${reason}`);
                });
                lines.push('');
            });
            const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `准大一开学清单-${new Date().toISOString().slice(0, 10)}.txt`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('清单已导出');
        }
        function importChecklist(text) {
            const state = {};
            const ignored = {};
            const knownItems = new Map(getAllItems().map(item => [item.name, item]));
            text.split(/\r?\n/).forEach(line => {
                const match = line.match(/^(已带|忽略|未带)\s*\t(.+?)(?:（原因：(.+)）)?$/);
                if (!match) return;
                const item = knownItems.get(match[2].trim());
                if (!item) return;
                if (match[1] === '已带') state[item.id] = true;
                if (match[1] === '忽略') ignored[item.id] = match[3] || '';
            });
            saveState(state); saveIgnored(ignored); renderCategories(); showToast('清单已导入');
        }

        // ===== DOM 渲染 =====
        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            categoriesData.forEach(cat => {
                const visibleItems = getVisibleItems(cat.items);
                const { total, done } = getCategoryStats(cat.id);
                const progress = total === 0 ? 0 : Math.round((done / total) * 100);

                const card = document.createElement('div');
                card.className = 'category-card';
                card.id = `cat-${cat.id}`;

                const state = loadState();
                const ignored = loadIgnored();

                let itemsHTML = '';
                visibleItems.forEach(item => {
                    const checked = !!state[item.id];
                    const itemIgnored = Object.prototype.hasOwnProperty.call(ignored, item.id);
                    const ignoredReason = typeof ignored[item.id] === 'string' ? ignored[item.id] : '';
                    const customActions = item.id.startsWith('custom_') ? `<span class="custom-item-actions"><button class="delete-item-btn" type="button" data-item-id="${item.id}" data-category-id="${cat.id}">删除物品</button></span>` : '';
                    const detailAction = itemDetails[item.id] ? `<button class="detail-btn" type="button" data-detail="${item.id}" aria-label="查看${escapeHtml(item.name)}详情">?</button>` : '';
                    itemsHTML += `
                        <label class="item-check ${checked ? 'checked' : ''} ${itemIgnored ? 'ignored' : ''}" data-item-id="${item.id}" title="${itemIgnored ? `已忽略${ignoredReason ? `：${ignoredReason}` : ''}` : ''}">
                            <input type="checkbox" ${checked || itemIgnored ? 'checked' : ''} ${itemIgnored ? 'disabled' : ''}>
                            <span class="custom-checkbox"></span>
                            <span class="item-name">${item.name}${itemIgnored && ignoredReason ? `：${escapeHtml(ignoredReason)}` : ''}</span>
                            ${detailAction}${customActions}
                        </label>
                    `;
                });

                card.innerHTML = `
                    <div class="category-header">
                        <span class="category-icon">${cat.icon}</span>
                        <span class="category-title">${cat.name}</span>
                        <button class="category-check-btn" type="button" data-category-id="${cat.id}">✅ 一键标记为已带</button>
                        <button class="category-cancel-btn" type="button" data-category-id="${cat.id}">↩️ 一键取消标记</button>
                        <span class="category-count">${done}/${total}</span>
                        <div class="category-actions">
                            <button class="ignore-btn" type="button" data-category-id="${cat.id}">忽略物品</button>
                            <button class="add-btn" type="button" data-category-id="${cat.id}">添加物品</button>

                        </div>

                    <div class="items-list">

                container.appendChild(card);
            });

            // 绑定事件
            document.querySelectorAll('.item-check').forEach(label => {
                const input = label.querySelector('input[type="checkbox"]');
                const itemId = label.dataset.itemId;

                input.addEventListener('change', function(e) {
                    e.stopPropagation();
                    if (isIgnored(itemId)) return;
                    const checked = this.checked;
                    setItemState(itemId, checked);
                    label.classList.toggle('checked', checked);
                    updateProgress();
                    updateCategoryProgress(itemId);
                });
            });

            document.querySelectorAll('.category-check-btn').forEach(button => button.addEventListener('click', () => {
                const category = categoriesData.find(cat => cat.id === button.dataset.categoryId);
                if (!category) return;
                const state = loadState();
                getVisibleItems(category.items).forEach(item => {
                    if (!isIgnored(item.id)) state[item.id] = true;
                });
                saveState(state); renderCategories(); showToast(`“${category.name}”已全部标记为已带`);
            }));
            document.querySelectorAll('.category-cancel-btn').forEach(button => button.addEventListener('click', () => {
                const category = categoriesData.find(cat => cat.id === button.dataset.categoryId);
                if (!category) return;
                openItemModal('取消分类标记', `确定取消“${category.name}”内所有物品的标记吗？`, '<label class="modal-skip-ignored"><input id="skipIgnoredItems" type="checkbox"> 跳过已被忽略的物品</label>', () => {
                    const skipIgnored = document.getElementById('skipIgnoredItems').checked;
                    const state = loadState();
                    const ignored = loadIgnored();
                    getVisibleItems(category.items).forEach(item => {
                        if (skipIgnored && isIgnored(item.id)) return;
                        delete state[item.id];
                        delete ignored[item.id];
                    });
                    saveState(state);
                    saveIgnored(ignored);
                    closeItemModal(); renderCategories(); showToast(`已取消“${category.name}”的标记`); return true;
                });
            }));
            document.querySelectorAll('.add-btn').forEach(button => button.addEventListener('click', () => openAddModal(button.dataset.categoryId)));
            document.querySelectorAll('.ignore-btn').forEach(button => button.addEventListener('click', () => openIgnoreModal(button.dataset.categoryId)));
            document.querySelectorAll('.delete-item-btn').forEach(button => button.addEventListener('click', () => openDeleteModal(button.dataset.categoryId, button.dataset.itemId)));
            document.querySelectorAll('.detail-btn').forEach(button => button.addEventListener('click', event => {
                event.preventDefault();
                event.stopPropagation();
                openDetailsModal(button.dataset.detail);
            }));

            updateProgress();
        }

        function updateProgress() {
            const total = getTotalCount();
            const done = getCheckedCount();
            const percent = total === 0 ? 0 : Math.round((done / total) * 100);

            document.getElementById('doneCount').textContent = done;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('percentDisplay').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';

        function updateCategoryProgress(itemId) {
            // 找到该物品所属的分类
            let catId = null;
            for (const cat of categoriesData) {
                if (getVisibleItems(cat.items).some(item => item.id === itemId)) {
                    catId = cat.id;
                    break;
                }
            }
            if (!catId) return;

            const card = document.getElementById(`cat-${catId}`);
            if (!card) return;

            const { total, done } = getCategoryStats(catId);
            const progress = total === 0 ? 0 : Math.round((done / total) * 100);

            const countEl = card.querySelector('.category-count');
            if (countEl) countEl.textContent = `${done}/${total}`;

            const miniFill = card.querySelector('.mini-fill');
            if (miniFill) miniFill.style.width = progress + '%';
        }

        // ===== 搜索 =====
        function highlightSearchResult(index) {
            if (!searchMatches.length) return;
            searchIndex = (index + searchMatches.length) % searchMatches.length;
            const target = document.querySelector(`[data-item-id="${searchMatches[searchIndex].id}"]`);
            if (!target) return;
            document.querySelectorAll('.search-highlight').forEach(el => el.classList.remove('search-highlight'));
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.remove('search-highlight');
            void target.offsetWidth;
            target.classList.add('search-highlight');
            setTimeout(() => target.classList.remove('search-highlight'), 3000);
            document.querySelectorAll('#searchNav button').forEach((button, i) => button.classList.toggle('selected', i === searchIndex));
        }

        function searchItems() {
            const keyword = document.getElementById('itemSearchInput').value.trim().toLowerCase();
            const nav = document.getElementById('searchNav');
            nav.innerHTML = '';
            searchMatches = keyword ? getAllItems().filter(item => item.name.toLowerCase().includes(keyword)) : [];
            if (!searchMatches.length) { nav.classList.remove('show'); showToast(keyword ? '未找到匹配物品' : '请输入物品名称'); return; }
            searchMatches.forEach((item, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = `${index + 1}/${searchMatches.length}`;
                button.title = item.name;

        // ===== 主题切换 =====
        function initTheme() {
            const saved = localStorage.getItem('theme-preference') || 'system';
            const themeIcon = document.getElementById('themeIcon');

            function applyTheme(theme) {
                let final = theme;
                if (theme === 'system') {
                    final = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', final);
                themeIcon.className = final === 'dark' ? 'ri-moon-line' : 'ri-sun-line';
            }

            applyTheme(saved);

            document.getElementById('themeToggle').addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                themeIcon.className = next === 'dark' ? 'ri-moon-line' : 'ri-sun-line';
                localStorage.setItem('theme-preference', next);
            });

            // 监听系统主题变化
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                const pref = localStorage.getItem('theme-preference');
                if (pref === 'system') {
                    const dark = e.matches;
                    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                    themeIcon.className = dark ? 'ri-moon-line' : 'ri-sun-line';
                }
            });
        }

        // ===== 粒子背景 =====
        function initParticles() {
            const container = document.getElementById('particles');
            const count = 25;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 80 + 40;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 20 + 's';
                p.style.opacity = Math.random() * 0.08 + 0.03;
                container.appendChild(p);
            }
        }

        // ===== 滚动快捷操作 =====
        function initScrollTools() {
            const floatingTools = document.getElementById('floatingTools');
            const searchSection = document.querySelector('.search-section');
            const progressSection = document.querySelector('.progress-section');
            const updateVisibility = () => {
                const infoHidden = window.scrollY > progressSection.offsetTop + progressSection.offsetHeight;
                floatingTools.classList.toggle('show', infoHidden);
                if (!infoHidden) searchSection.classList.remove('top-search-bar');
            };
            document.getElementById('floatingSearchBtn').addEventListener('click', () => {
                searchSection.classList.add('top-search-bar');
                document.getElementById('itemSearchInput').focus();
            });
            document.getElementById('backToTopBtn').addEventListener('click', () => {
                searchSection.classList.remove('top-search-bar');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            window.addEventListener('scroll', updateVisibility, { passive: true });
            updateVisibility();
        }

        // ===== 性别选择 =====
        function openGenderPanel(required = false) {
            const panel = document.getElementById('genderPanel');
            panel.classList.add('show');
            panel.dataset.required = required ? 'true' : 'false';
            genderDraft = currentGender;
            document.querySelectorAll('.gender-option').forEach(button => button.classList.toggle('selected', button.dataset.gender === genderDraft));
        }

        function initGender() {
            document.getElementById('genderBtn').addEventListener('click', () => openGenderPanel(false));
            document.getElementById('genderBtnText').textContent = currentGender === 'male' ? '性别：男' : currentGender === 'female' ? '性别：女' : '性别：未选择';
            document.querySelectorAll('.gender-option').forEach(button => button.addEventListener('click', () => {
                genderDraft = button.dataset.gender;
                document.querySelectorAll('.gender-option').forEach(option => option.classList.toggle('selected', option === button));
            }));
            document.getElementById('genderConfirm').addEventListener('click', () => {
                if (!genderDraft) { showToast('请选择男或女'); return; }
                currentGender = genderDraft;
                localStorage.setItem(GENDER_KEY, currentGender);
                document.getElementById('genderBtnText').textContent = currentGender === 'male' ? '性别：男' : '性别：女';
                document.getElementById('genderPanel').classList.remove('show');
                renderCategories();
                showToast(`已切换为${currentGender === 'male' ? '男' : '女'}生清单`);
            });
            if (!currentGender) openGenderPanel(true);
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', function() {
            initParticles();
            initTheme();
            initGender();
            initScrollTools();
            applyCustomItems();
            renderCategories();

            // 绑定全局按钮
            document.getElementById('checkAllBtn').addEventListener('click', checkAll);
            document.getElementById('uncheckAllBtn').addEventListener('click', uncheckAll);
            document.getElementById('resetAllBtn').addEventListener('click', resetAll);
            document.getElementById('itemSearchBtn').addEventListener('click', searchItems);
            document.getElementById('itemSearchInput').addEventListener('keydown', event => {
                if (event.key === 'Enter') searchItems();
            });
            document.getElementById('exportBtn').addEventListener('click', exportChecklist);
            document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
            document.getElementById('importFileInput').addEventListener('change', event => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => importChecklist(String(reader.result || ''));
                reader.readAsText(file);
                event.target.value = '';
            });

            // 键盘快捷键：Ctrl+Shift+R 重置
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && e.key === 'R') {
                    e.preventDefault();
                    resetAll();
                }
            });
        });
    </script>

</body>
</html>
