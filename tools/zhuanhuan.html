<html>
<head>

<body>

                </textarea>

            <div class="preview-section">

                <h3 class="option-title">Electron 打包</h3>

                <button class="btn" onclick="showInstructions('Electron')">查看说明</button>
            </div>
            
            <div class="option-card">
                <h3 class="option-title">WebView 打包</h3>
                <p class="option-desc">使用原生平台WebView组件打包为移动应用（Android、iOS）</p>
                <button class="btn" onclick="showInstructions('WebView')">查看说明</button>
            </div>
            
            <div class="option-card">
                <h3 class="option-title">PWA 渐进式Web应用</h3>
                <p class="option-desc">转换为可安装的渐进式Web应用程序，支持离线功能</p>
                <button class="btn" onclick="showInstructions('PWA')">查看说明</button>
            </div>
            
            <div class="option-card">
                <h3 class="option-title">Tauri 打包</h3>
                <p class="option-desc">使用Rust和Web技术构建更小、更快的桌面应用程序</p>
                <button class="btn" onclick="showInstructions('Tauri')">查看说明</button>

    <script>
        // 实时预览功能
        const editor = document.getElementById('html-editor');
        const preview = document.getElementById('preview');
        
        function updatePreview() {
            preview.innerHTML = editor.value;
        }
        
        editor.addEventListener('input', updatePreview);
        
        // 初始化预览
        updatePreview();
        
        // 显示转换说明
        function showInstructions(type) {
            let message = '';
            
            switch(type) {
                case 'Electron':
                    message = 'Electron打包步骤：\n1. 安装Node.js和npm\n2. 创建项目文件夹并初始化npm\n3. 安装Electron: npm install electron --save-dev\n4. 创建主进程文件main.js\n5. 在package.json中添加启动脚本\n6. 运行：npm start';
                    break;
                case 'WebView':
                    message = 'WebView打包步骤：\n\nAndroid (使用Android Studio):\n1. 创建新项目\n2. 添加WebView组件\n3. 加载您的HTML内容\n\niOS (使用Xcode):\n1. 创建新项目\n2. 添加WKWebView组件\n3. 加载您的HTML内容';
                    break;
                case 'PWA':
                    message = 'PWA转换步骤：\n1. 添加Web应用清单(manifest.json)\n2. 注册Service Worker\n3. 实现离线缓存功能\n4. 添加安装提示逻辑\n5. 通过HTTPS提供服务';
                    break;
                case 'Tauri':
                    message = 'Tauri打包步骤：\n1. 安装Rust环境\n2. 安装Tauri CLI: npm install -g @tauri-apps/cli\n3. 创建Tauri项目\n4. 将HTML文件放入src-tauri文件夹\n5. 运行：tauri dev 或 tauri build';
                    break;
            }
            
            alert(message);
        }
    </script>

    <script>
        (() => {
            const root = document.documentElement;
            const button = document.querySelector('[data-site-theme-toggle]');
            const saved = localStorage.getItem('site-theme-preference') || 'system';
            const apply = mode => {
                const light = mode === 'light' || (mode === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches);
                root.dataset.theme = light ? 'light' : 'dark';
                document.body.classList.toggle('site-light', light);
                if (button) button.innerHTML = light ? '<i class="ri-moon-line"></i>' : '<i class="ri-sun-line"></i>';
            };
            apply(saved);
            button?.addEventListener('click', () => {
                const next = root.dataset.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('site-theme-preference', next);
                apply(next);
            });
            matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if ((localStorage.getItem('site-theme-preference') || 'system') === 'system') apply('system');
            });
        })();
    </script>
