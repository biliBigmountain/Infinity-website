<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠小游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .header h1 {
            font-size: 2.8rem;
            color: #2575fc;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .header p {
            font-size: 1.1rem;
            color: #666;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .info-box {
            text-align: center;
        }
        
        .info-label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        
        .info-value {
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .hole {
            width: 100%;
            aspect-ratio: 1;
            background: #8B4513;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .hole:before {
            content: '';
            position: absolute;
            width: 100%;
            height: 40%;
            background: rgba(0, 0, 0, 0.2);
            bottom: 0;
            border-radius: 50% 50% 0 0;
        }
        
        .hole:hover {
            transform: scale(1.05);
        }
        
        .mole {
            position: absolute;
            width: 70%;
            height: 70%;
            background: #654321;
            border-radius: 50%;
            bottom: -50%;
            left: 15%;
            transition: bottom 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .mole:before, .mole:after {
            content: '';
            position: absolute;
            background: #000;
        }
        
        .mole:before {
            width: 30%;
            height: 30%;
            border-radius: 50%;
            top: 20%;
            left: 20%;
        }
        
        .mole:after {
            width: 30%;
            height: 30%;
            border-radius: 50%;
            top: 20%;
            right: 20%;
        }
        
        .mole.up {
            bottom: 15%;
        }
        
        .mole.hit {
            background: #ff6b6b;
            animation: hit 0.5s ease;
        }
        
        @keyframes hit {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #startBtn {
            background: linear-gradient(135deg, #4ecdc4, #6ee7e7);
        }
        
        #restartBtn {
            background: linear-gradient(135deg, #ffe66d, #ffcf40);
        }
        
        .instructions {
            background: rgba(103, 58, 183, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .instructions h3 {
            color: #2575fc;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .instructions ul {
            list-style: none;
            padding: 0;
        }
        
        .instructions li {
            margin-bottom: 10px;
            padding-left: 25px;
            position: relative;
        }
        
        .instructions li:before {
            content: "•";
            color: #2575fc;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border-radius: 20px;
            z-index: 10;
            display: none;
        }
        
        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ffeb3b;
        }
        
        .game-over p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }
        
        @media (max-width: 600px) {
            .game-board {
                gap: 10px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .info-value {
                font-size: 1.5rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                justify-content: center;
            }
        }
        
        .hit-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: fade 0.5s ease-out;
            pointer-events: none;
        }
        
        @keyframes fade {
            0% { opacity: 1; transform: scale(0); }
            100% { opacity: 0; transform: scale(2); }
        }
    </style>

    <style id="game-center-return-style">
        .game-center-return {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: .7rem 1.15rem;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 9999px;
            background: linear-gradient(135deg, #00a89a, #3695c5);
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
            text-decoration: none;
            font: 600 .95rem/1.2 'Noto Sans SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
        }
        .game-center-return:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 168, 154, .35);
            filter: brightness(1.08);
        }
        .game-center-return:focus-visible {
            outline: 3px solid rgba(68, 183, 238, .55);
            outline-offset: 3px;
        }
        @media (max-width: 600px) {
            .game-center-return {
                top: .75rem;
                right: .75rem;
                padding: .6rem .85rem;
                font-size: .85rem;
            }
        }
    </style>
</head>
<body>
    <a class="game-center-return" href="/index" aria-label="返回至游戏中心">返回至游戏中心</a>
    <div class="container">
        <div class="header">
            <h1>打地鼠小游戏</h1>
            <p>点击冒出来的地鼠获得分数，测试你的反应速度！</p>
        </div>
        
        <div class="game-info">
            <div class="info-box">
                <div class="info-label">得分</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">时间</div>
                <div class="info-value" id="timer">60</div>
            </div>
            <div class="info-box">
                <div class="info-label">最高分</div>
                <div class="info-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- 地鼠洞将由JavaScript生成 -->
        </div>
        
        <div class="controls">
            <button id="startBtn">
                <i class="fas fa-play"></i>开始游戏
            </button>
            <button id="restartBtn">
                <i class="fas fa-redo"></i>重新开始
            </button>
        </div>
        
        <div class="instructions">
            <h3>游戏说明</h3>
            <ul>
                <li>点击冒出来的地鼠可以获得1分</li>
                <li>游戏时间为60秒，时间结束后游戏结束</li>
                <li>地鼠出现的时间会随着游戏进行逐渐缩短</li>
                <li>连续击中地鼠会有连击加分</li>
                <li>尝试打破自己的最高分记录！</li>
            </ul>
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>游戏结束</h2>
            <p>你的最终得分: <span id="finalScore">0</span></p>
            <button id="playAgainBtn">
                <i class="fas fa-undo"></i>再玩一次
            </button>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            rows: 3,
            cols: 3,
            gameTime: 60,
            initialShowTime: 1500,
            minShowTime: 600,
            speedIncrease: 50
        };
        
        // 游戏状态
        let gameState = {
            score: 0,
            timeLeft: config.gameTime,
            highScore: localStorage.getItem('whackHighScore') || 0,
            isPlaying: false,
            showTime: config.initialShowTime,
            combo: 0,
            lastHitTime: 0
        };
        
        // DOM元素
        const gameBoard = document.getElementById('gameBoard');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const highScoreElement = document.getElementById('highScore');
        const startButton = document.getElementById('startBtn');
        const restartButton = document.getElementById('restartBtn');
        const playAgainButton = document.getElementById('playAgainBtn');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        
        // 初始化游戏
        function initGame() {
            // 清空游戏板
            gameBoard.innerHTML = '';
            
            // 创建地鼠洞
            for (let i = 0; i < config.rows * config.cols; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.innerHTML = '<div class="mole"></div>';
                gameBoard.appendChild(hole);
            }
            
            // 更新最高分显示
            highScoreElement.textContent = gameState.highScore;
        }
        
        // 开始游戏
        function startGame() {
            if (gameState.isPlaying) return;
            
            // 重置游戏状态
            gameState.score = 0;
            gameState.timeLeft = config.gameTime;
            gameState.isPlaying = true;
            gameState.showTime = config.initialShowTime;
            gameState.combo = 0;
            gameState.lastHitTime = 0;
            
            // 更新UI
            scoreElement.textContent = '0';
            timerElement.textContent = gameState.timeLeft;
            gameOverScreen.style.display = 'none';
            startButton.disabled = true;
            
            // 开始游戏循环
            startMoleLoop();
            startTimer();
        }
        
        // 地鼠循环
        function startMoleLoop() {
            if (!gameState.isPlaying) return;
            
            const holes = document.querySelectorAll('.hole');
            const randomIndex = Math.floor(Math.random() * holes.length);
            const mole = holes[randomIndex].querySelector('.mole');
            
            // 显示地鼠
            mole.classList.add('up');
            
            // 设置地鼠隐藏时间
            setTimeout(() => {
                mole.classList.remove('up');
                if (gameState.isPlaying) {
                    // 增加游戏难度
                    gameState.showTime = Math.max(
                        config.minShowTime, 
                        gameState.showTime - config.speedIncrease
                    );
                    
                    // 继续循环
                    startMoleLoop();
                }
            }, gameState.showTime);
        }
        
        // 游戏计时器
        function startTimer() {
            const timerInterval = setInterval(() => {
                if (!gameState.isPlaying) {
                    clearInterval(timerInterval);
                    return;
                }
                
                gameState.timeLeft--;
                timerElement.textContent = gameState.timeLeft;
                
                if (gameState.timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }
        
        // 处理点击事件
        function handleClick(e) {
            if (!gameState.isPlaying) return;
            
            if (e.target.classList.contains('mole') && 
                e.target.classList.contains('up')) {
                
                // 击中地鼠
                e.target.classList.remove('up');
                e.target.classList.add('hit');
                
                // 创建击中效果
                const effect = document.createElement('div');
                effect.className = 'hit-effect';
                e.target.parentElement.appendChild(effect);
                
                // 移除效果元素
                setTimeout(() => {
                    effect.remove();
                    e.target.classList.remove('hit');
                }, 500);
                
                // 更新分数
                updateScore();
            }
        }
        
        // 更新分数
        function updateScore() {
            // 计算连击
            const now = Date.now();
            if (now - gameState.lastHitTime < 2000) {
                gameState.combo++;
            } else {
                gameState.combo = 1;
            }
            
            gameState.lastHitTime = now;
            
            // 计算得分（连击有加分）
            const points = 1 + Math.min(5, Math.floor(gameState.combo / 3));
            gameState.score += points;
            
            // 更新UI
            scoreElement.textContent = gameState.score;
            
            // 更新最高分
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                highScoreElement.textContent = gameState.highScore;
                localStorage.setItem('whackHighScore', gameState.highScore);
            }
        }
        
        // 结束游戏
        function endGame() {
            gameState.isPlaying = false;
            startButton.disabled = false;
            
            // 显示游戏结束画面
            finalScoreElement.textContent = gameState.score;
            gameOverScreen.style.display = 'flex';
        }
        
        // 事件监听
        gameBoard.addEventListener('click', handleClick);
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        playAgainButton.addEventListener('click', startGame);
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
