<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        header {
            padding: 20px 0;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 25px;
            min-width: 120px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .game-area {
            margin: 20px auto;
            position: relative;
        }
        
        canvas {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #ff6b6b;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn:hover {
            background: #ff5252;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-start {
            background: #2ecc71;
        }
        
        .btn-start:hover {
            background: #27ae60;
        }
        
        .btn-pause {
            background: #f39c12;
        }
        
        .btn-pause:hover {
            background: #e67e22;
        }
        
        .level-select {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .level-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .level-btn.active {
            background: #ff6b6b;
        }
        
        .instructions {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            margin: 25px auto;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .instructions h3 {
            margin-bottom: 10px;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            display: none;
        }
        
        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
        
        .game-over p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .mobile-controls {
            display: none;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .mobile-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
        
        @media (max-width: 600px) {
            .mobile-controls {
                display: flex;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .stat-box {
                padding: 10px 15px;
                min-width: 90px;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
            
            canvas {
                width: 300px;
                height: 400px;
            }
        }
    </style>

    <style id="game-center-return-style">
        .game-center-return {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: .7rem 1.15rem;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 9999px;
            background: linear-gradient(135deg, #00a89a, #3695c5);
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
            text-decoration: none;
            font: 600 .95rem/1.2 'Noto Sans SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
        }
        .game-center-return:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 168, 154, .35);
            filter: brightness(1.08);
        }
        .game-center-return:focus-visible {
            outline: 3px solid rgba(68, 183, 238, .55);
            outline-offset: 3px;
        }
        @media (max-width: 600px) {
            .game-center-return {
                top: .75rem;
                right: .75rem;
                padding: .6rem .85rem;
                font-size: .85rem;
            }
        }
    </style>
</head>
<body>
    <a class="game-center-return" href="/index" aria-label="返回至游戏中心">返回至游戏中心</a>
    <div class="container">
        <header>
            <h1>打砖块游戏</h1>
            <p class="subtitle">控制挡板反弹球击碎所有砖块！</p>
        </header>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">分数</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="lives">3</div>
                <div class="stat-label">生命</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="level">1</div>
                <div class="stat-label">关卡</div>
            </div>
        </div>
        
        <div class="level-select">
            <button class="level-btn active" data-level="1">关卡 1</button>
            <button class="level-btn" data-level="2">关卡 2</button>
            <button class="level-btn" data-level="3">关卡 3</button>
        </div>
        
        <div class="game-area">
            <canvas id="game-canvas" width="500" height="400"></canvas>
            <div class="game-over" id="game-over">
                <h2 id="game-result">游戏结束!</h2>
                <p>你的分数: <span id="final-score">0</span></p>
                <button class="btn btn-start" id="restart-btn">重新开始</button>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-start" id="start-btn">开始游戏</button>
            <button class="btn btn-pause" id="pause-btn">暂停</button>
        </div>
        
        <div class="mobile-controls">
            <button class="mobile-btn" id="left-btn">←</button>
            <button class="mobile-btn" id="right-btn">→</button>
        </div>
        
        <div class="instructions">
            <h3>游戏规则</h3>
            <p>使用鼠标或键盘左右箭头(或屏幕上的方向按钮)控制挡板移动。用球击碎所有砖块即可过关。每关砖块布局不同，难度逐渐增加。</p>
            <p>如果球掉落到屏幕底部，你将失去一条生命。生命值为0时游戏结束。</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏变量
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            
            // 游戏常量
            const PADDLE_WIDTH = 80;
            const PADDLE_HEIGHT = 15;
            const PADDLE_SPEED = 8;
            const BALL_RADIUS = 8;
            const BRICK_ROWS = 5;
            const BRICK_COLUMNS = 8;
            const BRICK_WIDTH = 50;
            const BRICK_HEIGHT = 20;
            const BRICK_PADDING = 5;
            const BRICK_OFFSET_TOP = 50;
            const BRICK_OFFSET_LEFT = 30;
            
            // 游戏状态
            let paddle = {};
            let ball = {};
            let bricks = [];
            let score = 0;
            let lives = 3;
            let level = 1;
            let gameRunning = false;
            let rightPressed = false;
            let leftPressed = false;
            let animationId = null;
            
            // 元素引用
            const scoreElement = document.getElementById('score');
            const livesElement = document.getElementById('lives');
            const levelElement = document.getElementById('level');
            const startBtn = document.getElementById('start-btn');
            const pauseBtn = document.getElementById('pause-btn');
            const restartBtn = document.getElementById('restart-btn');
            const gameOverScreen = document.getElementById('game-over');
            const finalScoreElement = document.getElementById('final-score');
            const gameResultElement = document.getElementById('game-result');
            const levelBtns = document.querySelectorAll('.level-btn');
            
            // 初始化游戏
            function initGame() {
                // 初始化挡板
                paddle = {
                    x: canvas.width / 2 - PADDLE_WIDTH / 2,
                    y: canvas.height - PADDLE_HEIGHT - 10,
                    width: PADDLE_WIDTH,
                    height: PADDLE_HEIGHT,
                    speed: PADDLE_SPEED
                };
                
                // 初始化球
                resetBall();
                
                // 初始化砖块
                createBricks();
                
                // 更新UI
                scoreElement.textContent = score;
                livesElement.textContent = lives;
                levelElement.textContent = level;
                
                // 绘制游戏
                draw();
            }
            
            // 重置球的位置
            function resetBall() {
                ball = {
                    x: canvas.width / 2,
                    y: canvas.height - PADDLE_HEIGHT - 20,
                    dx: 4,
                    dy: -4,
                    radius: BALL_RADIUS
                };
            }
            
            // 创建砖块
            function createBricks() {
                bricks = [];
                
                // 根据关卡调整砖块布局
                let brickHealth = 1;
                if (level === 2) brickHealth = 2;
                if (level === 3) brickHealth = 3;
                
                for (let c = 0; c < BRICK_COLUMNS; c++) {
                    bricks[c] = [];
                    for (let r = 0; r < BRICK_ROWS; r++) {
                        // 根据关卡创建不同的砖块布局
                        let brickX = c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT;
                        let brickY = r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP;
                        
                        // 随机决定是否创建砖块（关卡3有随机性）
                        if (level < 3 || Math.random() > 0.2) {
                            bricks[c][r] = {
                                x: brickX,
                                y: brickY,
                                status: 1,
                                health: brickHealth,
                                width: BRICK_WIDTH,
                                height: BRICK_HEIGHT,
                                // 根据行数设置不同颜色
                                color: `hsl(${r * 36}, 70%, 60%)`
                            };
                        } else {
                            bricks[c][r] = { status: 0 }; // 无砖块
                        }
                    }
                }
            }
            
            // 绘制游戏元素
            function draw() {
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制挡板
                ctx.beginPath();
                ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
                ctx.fillStyle = '#2ecc71';
                ctx.fill();
                ctx.closePath();
                
                // 绘制球
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.closePath();
                
                // 绘制砖块
                for (let c = 0; c < BRICK_COLUMNS; c++) {
                    for (let r = 0; r < BRICK_ROWS; r++) {
                        if (bricks[c][r].status === 1) {
                            ctx.beginPath();
                            ctx.rect(bricks[c][r].x, bricks[c][r].y, bricks[c][r].width, bricks[c][r].height);
                            ctx.fillStyle = bricks[c][r].color;
                            ctx.fill();
                            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                            ctx.stroke();
                            ctx.closePath();
                            
                            // 绘制砖块生命值（如果大于1）
                            if (bricks[c][r].health > 1) {
                                ctx.font = '12px Arial';
                                ctx.fillStyle = 'white';
                                ctx.textAlign = 'center';
                                ctx.fillText(
                                    bricks[c][r].health, 
                                    bricks[c][r].x + bricks[c][r].width / 2, 
                                    bricks[c][r].y + bricks[c][r].height / 2 + 4
                                );
                            }
                        }
                    }
                }
                
                // 绘制分数
                ctx.font = '16px Arial';
                ctx.fillStyle = '#fff';
                ctx.fillText(`分数: ${score}`, 20, 20);
                
                // 绘制生命值
                ctx.fillText(`生命: ${lives}`, canvas.width - 80, 20);
                
                // 绘制关卡
                ctx.fillText(`关卡: ${level}`, canvas.width / 2 - 30, 20);
            }
            
            // 碰撞检测
            function collisionDetection() {
                // 球与砖块的碰撞检测
                for (let c = 0; c < BRICK_COLUMNS; c++) {
                    for (let r = 0; r < BRICK_ROWS; r++) {
                        const brick = bricks[c][r];
                        if (brick.status === 1) {
                            if (
                                ball.x > brick.x &&
                                ball.x < brick.x + brick.width &&
                                ball.y > brick.y &&
                                ball.y < brick.y + brick.height
                            ) {
                                ball.dy = -ball.dy;
                                
                                // 减少砖块生命值
                                brick.health--;
                                
                                if (brick.health <= 0) {
                                    brick.status = 0;
                                    score += 10;
                                    scoreElement.textContent = score;
                                }
                                
                                // 检查是否所有砖块都被击碎
                                checkLevelCompletion();
                            }
                        }
                    }
                }
                
                // 球与墙壁的碰撞检测
                if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                    ball.dx = -ball.dx;
                }
                
                if (ball.y + ball.dy < ball.radius) {
                    ball.dy = -ball.dy;
                } else if (ball.y + ball.dy > canvas.height - ball.radius) {
                    // 球与挡板的碰撞检测
                    if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                        // 根据击中挡板的位置改变球的反弹角度
                        const hitPosition = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                        ball.dx = hitPosition * 5; // 最大偏转角度
                        ball.dy = -Math.abs(ball.dy); // 确保球向上弹
                    } else {
                        // 球落地，失去一条生命
                        lives--;
                        livesElement.textContent = lives;
                        
                        if (lives <= 0) {
                            gameOver(false);
                        } else {
                            resetBall();
                        }
                    }
                }
            }
            
            // 检查关卡是否完成
            function checkLevelCompletion() {
                let allBricksDestroyed = true;
                
                for (let c = 0; c < BRICK_COLUMNS; c++) {
                    for (let r = 0; r < BRICK_ROWS; r++) {
                        if (bricks[c][r].status === 1) {
                            allBricksDestroyed = false;
                            break;
                        }
                    }
                    if (!allBricksDestroyed) break;
                }
                
                if (allBricksDestroyed) {
                    if (level < 3) {
                        // 进入下一关
                        level++;
                        levelElement.textContent = level;
                        createBricks();
                        resetBall();
                    } else {
                        // 所有关卡完成
                        gameOver(true);
                    }
                }
            }
            
            // 游戏结束
            function gameOver(isWin) {
                cancelAnimationFrame(animationId);
                gameRunning = false;
                startBtn.textContent = '开始游戏';
                
                // 显示游戏结束屏幕
                gameResultElement.textContent = isWin ? '恭喜通关!' : '游戏结束!';
                finalScoreElement.textContent = score;
                gameOverScreen.style.display = 'flex';
            }
            
            // 更新游戏状态
            function update() {
                // 移动挡板
                if (rightPressed && paddle.x < canvas.width - paddle.width) {
                    paddle.x += paddle.speed;
                } else if (leftPressed && paddle.x > 0) {
                    paddle.x -= paddle.speed;
                }
                
                // 移动球
                ball.x += ball.dx;
                ball.y += ball.dy;
                
                // 碰撞检测
                collisionDetection();
                
                // 绘制游戏
                draw();
                
                // 继续游戏循环
                if (gameRunning) {
                    animationId = requestAnimationFrame(update);
                }
            }
            
            // 开始游戏
            function startGame() {
                if (gameRunning) return;
                
                // 隐藏游戏结束屏幕
                gameOverScreen.style.display = 'none';
                
                gameRunning = true;
                startBtn.textContent = '重新开始';
                
                // 初始化游戏
                initGame();
                
                // 开始游戏循环
                animationId = requestAnimationFrame(update);
            }
            
            // 暂停游戏
            function pauseGame() {
                if (!gameRunning) return;
                
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                    pauseBtn.textContent = '继续';
                    gameRunning = false;
                } else {
                    gameRunning = true;
                    pauseBtn.textContent = '暂停';
                    update();
                }
            }
            
            // 事件监听
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Right' || e.key === 'ArrowRight') {
                    rightPressed = true;
                } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                    leftPressed = true;
                } else if (e.key === ' ') {
                    if (gameRunning) {
                        pauseGame();
                    } else {
                        startGame();
                    }
                }
            });
            
            document.addEventListener('keyup', (e) => {
                if (e.key === 'Right' || e.key === 'ArrowRight') {
                    rightPressed = false;
                } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                    leftPressed = false;
                }
            });
            
            // 鼠标控制
            canvas.addEventListener('mousemove', (e) => {
                if (!gameRunning) return;
                
                const relativeX = e.clientX - canvas.getBoundingClientRect().left;
                if (relativeX > 0 && relativeX < canvas.width) {
                    paddle.x = relativeX - paddle.width / 2;
                    
                    // 限制挡板不超出画布
                    if (paddle.x < 0) {
                        paddle.x = 0;
                    } else if (paddle.x > canvas.width - paddle.width) {
                        paddle.x = canvas.width - paddle.width;
                    }
                }
            });
            
            // 移动设备控制
            document.getElementById('left-btn').addEventListener('mousedown', () => {
                leftPressed = true;
            });
            
            document.getElementById('left-btn').addEventListener('mouseup', () => {
                leftPressed = false;
            });
            
            document.getElementById('left-btn').addEventListener('touchstart', () => {
                leftPressed = true;
            });
            
            document.getElementById('left-btn').addEventListener('touchend', () => {
                leftPressed = false;
            });
            
            document.getElementById('right-btn').addEventListener('mousedown', () => {
                rightPressed = true;
            });
            
            document.getElementById('right-btn').addEventListener('mouseup', () => {
                rightPressed = false;
            });
            
            document.getElementById('right-btn').addEventListener('touchstart', () => {
                rightPressed = true;
            });
            
            document.getElementById('right-btn').addEventListener('touchend', () => {
                rightPressed = false;
            });
            
            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', pauseGame);
            restartBtn.addEventListener('click', startGame);
            
            levelBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (gameRunning) return;
                    
                    levelBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    level = parseInt(btn.dataset.level);
                    score = 0;
                    lives = 3;
                    
                    initGame();
                });
            });
            
            // 初始化显示
            initGame();
        });
    </script>
</body>
</html>
