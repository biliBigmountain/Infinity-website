<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连连看小游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .header h1 {
            font-size: 2.8rem;
            color: #2575fc;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .header p {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .info-box {
            text-align: center;
        }
        
        .info-label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        
        .info-value {
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin-bottom: 25px;
            background: rgba(103, 58, 183, 0.1);
            padding: 15px;
            border-radius: 15px;
        }
        
        .tile {
            aspect-ratio: 1;
            background: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
            user-select: none;
        }
        
        .tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }
        
        .tile.selected {
            background: #ffe066;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 224, 102, 0.8);
        }
        
        .tile.matched {
            visibility: hidden;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #hintBtn {
            background: linear-gradient(135deg, #4ecdc4, #6ee7e7);
        }
        
        #shuffleBtn {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
        }
        
        #restartBtn {
            background: linear-gradient(135deg, #ffe66d, #ffcf40);
        }
        
        .instructions {
            background: rgba(103, 58, 183, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .instructions h3 {
            color: #2575fc;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .instructions ul {
            list-style: none;
            padding: 0;
        }
        
        .instructions li {
            margin-bottom: 10px;
            padding-left: 25px;
            position: relative;
        }
        
        .instructions li:before {
            content: "•";
            color: #2575fc;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        .line-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .connecting-line {
            stroke: #ff6b6b;
            stroke-width: 4;
            stroke-dasharray: 10;
            animation: dash 1s linear infinite;
        }
        
        @keyframes dash {
            to {
                stroke-dashoffset: 20;
            }
        }
        
        .success-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ff6b6b;
            border-radius: 50%;
            animation: firework 1s ease-out;
        }
        
        @keyframes firework {
            0% {
                transform: translate(0, 0);
                opacity: 1;
                width: 5px;
                height: 5px;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
                width: 2px;
                height: 2px;
            }
        }
        
        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(6, 1fr);
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .tile {
                font-size: 1.5rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>

    <style id="game-center-return-style">
        .game-center-return {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: .7rem 1.15rem;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 9999px;
            background: linear-gradient(135deg, #00a89a, #3695c5);
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
            text-decoration: none;
            font: 600 .95rem/1.2 'Noto Sans SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
        }
        .game-center-return:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 168, 154, .35);
            filter: brightness(1.08);
        }
        .game-center-return:focus-visible {
            outline: 3px solid rgba(68, 183, 238, .55);
            outline-offset: 3px;
        }
        @media (max-width: 600px) {
            .game-center-return {
                top: .75rem;
                right: .75rem;
                padding: .6rem .85rem;
                font-size: .85rem;
            }
        }
    </style>
</head>
<body>
    <a class="game-center-return" href="/index" aria-label="返回至游戏中心">返回至游戏中心</a>
    <div class="container">
        <div class="header">
            <h1>连连看小游戏</h1>
            <p>找到相同的图案并用不超过三个拐角的线连接它们</p>
        </div>
        
        <div class="game-info">
            <div class="info-box">
                <div class="info-label">得分</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">时间</div>
                <div class="info-value" id="time">120</div>
            </div>
            <div class="info-box">
                <div class="info-label">关卡</div>
                <div class="info-value" id="level">1</div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- 游戏方块将由JavaScript生成 -->
        </div>
        
        <div class="controls">
            <button id="hintBtn">
                <i class="fas fa-lightbulb"></i>提示
            </button>
            <button id="shuffleBtn">
                <i class="fas fa-random"></i>重新排列
            </button>
            <button id="restartBtn">
                <i class="fas fa-redo"></i>重新开始
            </button>
        </div>
        
        <div class="instructions">
            <h3>游戏规则</h3>
            <ul>
                <li>点击两个相同的图案，如果它们可以用不超过三个拐角的线连接，则会消除</li>
                <li>每消除一对得10分，连续消除有额外加分</li>
                <li>使用"提示"按钮可以高亮显示一对可消除的图案（会减少分数）</li>
                <li>在时间结束前消除所有图案即可进入下一关</li>
            </ul>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            rows: 8,
            cols: 8,
            symbols: ['🍎', '🍌', '🍇', '🍊', '🍓', '🍉', '🍍', '🥝', '🥭', '🍒', '🍑', '🍐', '🍋', '🍈', '🍏', '🥥'],
            initialTime: 120,
            baseScore: 10
        };
        
        // 游戏状态
        let gameState = {
            board: [],
            selectedTiles: [],
            score: 0,
            timeLeft: config.initialTime,
            level: 1,
            gameOver: false,
            combo: 0,
            lastMatchTime: 0
        };
        
        // DOM元素
        const gameBoard = document.getElementById('gameBoard');
        const scoreElement = document.getElementById('score');
        const timeElement = document.getElementById('time');
        const levelElement = document.getElementById('level');
        const hintButton = document.getElementById('hintBtn');
        const shuffleButton = document.getElementById('shuffleBtn');
        const restartButton = document.getElementById('restartBtn');
        
        // 初始化游戏
        function initGame() {
            // 重置游戏状态
            gameState = {
                board: [],
                selectedTiles: [],
                score: 0,
                timeLeft: config.initialTime - (gameState.level - 1) * 10,
                level: gameState.level,
                gameOver: false,
                combo: 0,
                lastMatchTime: 0
            };
            
            // 更新UI
            scoreElement.textContent = gameState.score;
            timeElement.textContent = gameState.timeLeft;
            levelElement.textContent = gameState.level;
            
            // 创建游戏板
            createBoard();
            
            // 开始计时器
            startTimer();
        }
        
        // 创建游戏板
        function createBoard() {
            gameBoard.innerHTML = '';
            
            // 生成符号对
            const totalTiles = config.rows * config.cols;
            const symbols = [];
            
            for (let i = 0; i < totalTiles / 2; i++) {
                const symbol = config.symbols[i % config.symbols.length];
                symbols.push(symbol, symbol);
            }
            
            // 随机打乱符号
            for (let i = symbols.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [symbols[i], symbols[j]] = [symbols[j], symbols[i]];
            }
            
            // 创建方块
            gameState.board = [];
            for (let i = 0; i < config.rows; i++) {
                gameState.board[i] = [];
                for (let j = 0; j < config.cols; j++) {
                    const index = i * config.cols + j;
                    const symbol = symbols[index];
                    
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.textContent = symbol;
                    tile.dataset.row = i;
                    tile.dataset.col = j;
                    tile.dataset.symbol = symbol;
                    
                    tile.addEventListener('click', () => handleTileClick(tile));
                    
                    gameBoard.appendChild(tile);
                    gameState.board[i][j] = {
                        symbol: symbol,
                        element: tile,
                        matched: false
                    };
                }
            }
        }
        
        // 处理方块点击
        function handleTileClick(tile) {
            if (gameState.gameOver) return;
            
            const row = parseInt(tile.dataset.row);
            const col = parseInt(tile.dataset.col);
            
            // 检查是否已经匹配或已选择
            if (gameState.board[row][col].matched) return;
            if (gameState.selectedTiles.includes(tile)) return;
            
            // 添加到已选方块
            tile.classList.add('selected');
            gameState.selectedTiles.push(tile);
            
            // 如果选择了两个方块，检查是否匹配
            if (gameState.selectedTiles.length === 2) {
                const [firstTile, secondTile] = gameState.selectedTiles;
                const firstSymbol = firstTile.dataset.symbol;
                const secondSymbol = secondTile.dataset.symbol;
                
                if (firstSymbol === secondSymbol) {
                    // 检查是否可以连接
                    if (canConnect(
                        parseInt(firstTile.dataset.row), parseInt(firstTile.dataset.col),
                        parseInt(secondTile.dataset.row), parseInt(secondTile.dataset.col)
                    )) {
                        // 匹配成功
                        setTimeout(() => {
                            handleMatchSuccess(firstTile, secondTile);
                        }, 300);
                    } else {
                        // 不能连接
                        setTimeout(() => {
                            firstTile.classList.remove('selected');
                            secondTile.classList.remove('selected');
                            gameState.selectedTiles = [];
                        }, 500);
                    }
                } else {
                    // 符号不匹配
                    setTimeout(() => {
                        firstTile.classList.remove('selected');
                        secondTile.classList.remove('selected');
                        gameState.selectedTiles = [];
                    }, 500);
                }
            }
        }
        
        // 处理匹配成功
        function handleMatchSuccess(firstTile, secondTile) {
            const firstRow = parseInt(firstTile.dataset.row);
            const firstCol = parseInt(firstTile.dataset.col);
            const secondRow = parseInt(secondTile.dataset.row);
            const secondCol = parseInt(secondTile.dataset.col);
            
            // 更新游戏状态
            gameState.board[firstRow][firstCol].matched = true;
            gameState.board[secondRow][secondCol].matched = true;
            
            // 添加匹配样式
            firstTile.classList.add('matched');
            secondTile.classList.add('matched');
            firstTile.classList.remove('selected');
            secondTile.classList.remove('selected');
            
            // 计算得分（连续匹配有加分）
            const now = Date.now();
            const timeDiff = now - gameState.lastMatchTime;
            gameState.lastMatchTime = now;
            
            if (timeDiff < 3000) {
                gameState.combo++;
            } else {
                gameState.combo = 0;
            }
            
            const comboBonus = gameState.combo * 5;
            gameState.score += config.baseScore + comboBonus;
            scoreElement.textContent = gameState.score;
            
            // 创建庆祝动画
            createCelebration(firstTile, secondTile);
            
            // 重置选择
            gameState.selectedTiles = [];
            
            // 检查游戏是否结束
            checkGameCompletion();
        }
        
        // 创建庆祝动画
        function createCelebration(tile1, tile2) {
            const rect1 = tile1.getBoundingClientRect();
            const rect2 = tile2.getBoundingClientRect();
            
            const centerX1 = rect1.left + rect1.width / 2;
            const centerY1 = rect1.top + rect1.height / 2;
            const centerX2 = rect2.left + rect2.width / 2;
            const centerY2 = rect2.top + rect2.height / 2;
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    
                    // 为第一个方块创建烟花
                    firework.style.left = centerX1 + 'px';
                    firework.style.top = centerY1 + 'px';
                    firework.style.setProperty('--tx', (Math.random() * 100 - 50) + 'px');
                    firework.style.setProperty('--ty', (Math.random() * 100 - 50) + 'px');
                    document.body.appendChild(firework);
                    
                    // 为第二个方块创建烟花
                    const firework2 = document.createElement('div');
                    firework2.className = 'firework';
                    firework2.style.left = centerX2 + 'px';
                    firework2.style.top = centerY2 + 'px';
                    firework2.style.setProperty('--tx', (Math.random() * 100 - 50) + 'px');
                    firework2.style.setProperty('--ty', (Math.random() * 100 - 50) + 'px');
                    document.body.appendChild(firework2);
                    
                    // 移除烟花元素
                    setTimeout(() => {
                        firework.remove();
                        firework2.remove();
                    }, 1000);
                }, i * 50);
            }
        }
        
        // 检查游戏是否完成
        function checkGameCompletion() {
            const allMatched = gameState.board.flat().every(tile => tile.matched);
            
            if (allMatched) {
                gameState.gameOver = true;
                setTimeout(() => {
                    alert(`恭喜！你完成了第${gameState.level}关！`);
                    gameState.level++;
                    initGame();
                }, 500);
            }
        }
        
        // 检查两个方块是否可以连接
        function canConnect(row1, col1, row2, col2) {
            // 简化版的连接检查算法
            // 实际游戏中应该实现一个更复杂的路径查找算法
            if (row1 === row2 && col1 === col2) return false;
            
            // 检查是否在同一行且之间没有障碍物
            if (row1 === row2) {
                const start = Math.min(col1, col2);
                const end = Math.max(col1, col2);
                for (let col = start + 1; col < end; col++) {
                    if (!gameState.board[row1][col].matched) return false;
                }
                return true;
            }
            
            // 检查是否在同一列且之间没有障碍物
            if (col1 === col2) {
                const start = Math.min(row1, row2);
                const end = Math.max(row1, row2);
                for (let row = start + 1; row < end; row++) {
                    if (!gameState.board[row][col1].matched) return false;
                }
                return true;
            }
            
            // 简化版：允许一个拐角的连接
            if (isCornerConnectable(row1, col1, row2, col2)) {
                return true;
            }
            
            return false;
        }
        
        // 检查一个拐角的连接
        function isCornerConnectable(row1, col1, row2, col2) {
            // 尝试通过一个中间点连接
            if (isDirectConnectable(row1, col1, row1, col2) && 
                isDirectConnectable(row1, col2, row2, col2) && 
                gameState.board[row1][col2].matched) {
                return true;
            }
            
            if (isDirectConnectable(row1, col1, row2, col1) && 
                isDirectConnectable(row2, col1, row2, col2) && 
                gameState.board[row2][col1].matched) {
                return true;
            }
            
            return false;
        }
        
        // 检查直接连接（直线无阻碍）
        function isDirectConnectable(row1, col1, row2, col2) {
            if (row1 === row2) {
                const start = Math.min(col1, col2);
                const end = Math.max(col1, col2);
                for (let col = start + 1; col < end; col++) {
                    if (!gameState.board[row1][col].matched) return false;
                }
                return true;
            }
            
            if (col1 === col2) {
                const start = Math.min(row1, row2);
                const end = Math.max(row1, row2);
                for (let row = start + 1; row < end; row++) {
                    if (!gameState.board[row][col1].matched) return false;
                }
                return true;
            }
            
            return false;
        }
        
        // 开始计时器
        function startTimer() {
            clearInterval(gameState.timerInterval);
            
            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                timeElement.textContent = gameState.timeLeft;
                
                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    gameState.gameOver = true;
                    alert('时间到！游戏结束。你的最终得分：' + gameState.score);
                }
            }, 1000);
        }
        
        // 提示功能
        hintButton.addEventListener('click', () => {
            if (gameState.gameOver) return;
            
            // 查找可匹配的方块对
            for (let i = 0; i < config.rows; i++) {
                for (let j = 0; j < config.cols; j++) {
                    if (gameState.board[i][j].matched) continue;
                    
                    for (let k = 0; k < config.rows; k++) {
                        for (let l = 0; l < config.cols; l++) {
                            if (i === k && j === l) continue;
                            if (gameState.board[k][l].matched) continue;
                            
                            if (gameState.board[i][j].symbol === gameState.board[k][l].symbol &&
                                canConnect(i, j, k, l)) {
                                // 高亮显示可匹配的方块
                                gameState.board[i][j].element.classList.add('selected');
                                gameState.board[k][l].element.classList.add('selected');
                                
                                setTimeout(() => {
                                    gameState.board[i][j].element.classList.remove('selected');
                                    gameState.board[k][l].element.classList.remove('selected');
                                }, 1000);
                                
                                // 减少分数作为提示成本
                                gameState.score = Math.max(0, gameState.score - 5);
                                scoreElement.textContent = gameState.score;
                                
                                return;
                            }
                        }
                    }
                }
            }
        });
        
        // 重新排列功能
        shuffleButton.addEventListener('click', () => {
            if (gameState.gameOver) return;
            
            // 收集所有未匹配的符号
            const unmatchedSymbols = [];
            for (let i = 0; i < config.rows; i++) {
                for (let j = 0; j < config.cols; j++) {
                    if (!gameState.board[i][j].matched) {
                        unmatchedSymbols.push(gameState.board[i][j].symbol);
                    }
                }
            }
            
            // 打乱符号顺序
            for (let i = unmatchedSymbols.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [unmatchedSymbols[i], unmatchedSymbols[j]] = [unmatchedSymbols[j], unmatchedSymbols[i]];
            }
            
            // 重新分配符号
            let index = 0;
            for (let i = 0; i < config.rows; i++) {
                for (let j = 0; j < config.cols; j++) {
                    if (!gameState.board[i][j].matched) {
                        gameState.board[i][j].symbol = unmatchedSymbols[index];
                        gameState.board[i][j].element.textContent = unmatchedSymbols[index];
                        gameState.board[i][j].element.dataset.symbol = unmatchedSymbols[index];
                        index++;
                    }
                }
            }
            
            // 减少分数作为重新排列成本
            gameState.score = Math.max(0, gameState.score - 10);
            scoreElement.textContent = gameState.score;
        });
        
        // 重新开始游戏
        restartButton.addEventListener('click', () => {
            clearInterval(gameState.timerInterval);
            gameState.level = 1;
            initGame();
        });
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
