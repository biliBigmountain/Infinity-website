    <script>
        const root=document.documentElement,settingsBtn=document.getElementById('settingsBtn'),settingsPanel=document.getElementById('settingsPanel'),options=document.querySelectorAll('.theme-option');function getThemeByTime(){const hour=new Date().getHours();return hour>=8&&hour<19?'light':'dark'}function applyTheme(theme){root.dataset.theme=theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme==='time'?getThemeByTime():theme}function selectTheme(theme){options.forEach(option=>option.classList.toggle('active',option.dataset.theme===theme));localStorage.setItem('theme-preference',theme);applyTheme(theme)}selectTheme(localStorage.getItem('theme-preference')||'system');settingsBtn.addEventListener('click',event=>{event.stopPropagation();settingsPanel.classList.toggle('active')});settingsPanel.addEventListener('click',event=>event.stopPropagation());document.addEventListener('click',()=>settingsPanel.classList.remove('active'));options.forEach(option=>option.addEventListener('click',()=>selectTheme(option.dataset.theme)));matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if((localStorage.getItem('theme-preference')||'system')==='system')applyTheme('system')});setInterval(()=>{if(localStorage.getItem('theme-preference')==='time')applyTheme('time')},300000);
        const menuToggle=document.getElementById('menuToggle'),navMenu=document.getElementById('navMenu');menuToggle.addEventListener('click',event=>{event.stopPropagation();const open=navMenu.classList.toggle('active');menuToggle.innerHTML=open?'<i class="ri-close-line"></i>':'<i class="ri-menu-line"></i>'}); menuToggle.setAttribute('aria-expanded', navMenu.classList.contains('active'));navMenu.querySelectorAll('.nav-link').forEach(link=>link.addEventListener('click',()=>{navMenu.classList.remove('active');menuToggle.innerHTML='<i class="ri-menu-line"></i>'})); menuToggle.setAttribute('aria-expanded', navMenu.classList.contains('active'));document.addEventListener('click',event=>{if(!navMenu.contains(event.target)&&!menuToggle.contains(event.target)){navMenu.classList.remove('active');menuToggle.innerHTML='<i class="ri-menu-line"></i>'}}); menuToggle.setAttribute('aria-expanded', navMenu.classList.contains('active'));const particles=document.getElementById('particles');for(let i=0;i<24;i++){const particle=document.createElement('span');particle.className='particle';const size=Math.random()*100+50;particle.style.width=`${size}px`;particle.style.height=`${size}px`;particle.style.left=`${Math.random()*100}%`;particle.style.top=`${Math.random()*100}%`;particle.style.animationDelay=`${Math.random()*20}s`;particles.appendChild(particle)}

    <script>
        (() => {
            const menuToggle = document.getElementById('menuToggle');
            const navMenu = document.getElementById('navMenu');
            if (!menuToggle || !navMenu) return;
            let scrollCheckTimer;
            const resetMenuOverflow = () => {
                clearTimeout(scrollCheckTimer);
                navMenu.classList.remove('nav-scrollable');
            };
            const checkMenuOverflow = () => {
                if (!navMenu.classList.contains('active')) return;
                navMenu.classList.toggle('nav-scrollable', navMenu.scrollHeight > navMenu.clientHeight);
            };
            menuToggle.addEventListener('click', () => {
                const opening = !navMenu.classList.contains('active');
                resetMenuOverflow();
                if (opening) scrollCheckTimer = setTimeout(checkMenuOverflow, 750);
            }, true);
            navMenu.addEventListener('click', event => {
                if (event.target.closest('.nav-link')) resetMenuOverflow();
            }, true);
            window.addEventListener('resize', () => {
                if (navMenu.classList.contains('active')) {
                    clearTimeout(scrollCheckTimer);
                    scrollCheckTimer = setTimeout(checkMenuOverflow, 750);
                }
            }, { passive: true });
        })();
    </script>
